name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site/data _site/assets/leaflet
          cp index.html app.js static-map.js styles.css dataset.html dataset.css _site/
          cp formations.html formations.js formations.css _site/
          cp panorama.html panorama.js panorama.css _site/
          cp data/pharma-static-data.js data/france-metropolitaine.svg _site/data/
          cp data/pharmaceutical_data_sources_analysis.md _site/data/
          cp -R assets/leaflet/. _site/assets/leaflet/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
